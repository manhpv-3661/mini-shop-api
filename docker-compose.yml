services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-mini_shop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mini_shop}
      POSTGRES_DB: ${DB_NAME:-mini_shop}
    ports:
      - '${DB_PORT:-5434}:5432'
    volumes:
      - mini_shop_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-mini_shop}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6381}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '${MAIL_PORT:-1026}:1025'
      - '8026:8025'

volumes:
  mini_shop_postgres_data:
